name: IAM Platform CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test-and-build:
    name: Backend Build & Test (Java 17 / Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run Backend Unit & Integration Tests
        working-directory: ./backend
        run: |
          mvn clean test -B

      - name: Package Backend Artifact
        working-directory: ./backend
        run: |
          mvn package -DskipTests -B

  frontend-build:
    name: Frontend Build (React 18 / Vite 5)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run Frontend Build Verification
        working-directory: ./frontend
        run: |
          npm run build

  docker-syntax-check:
    name: Docker & Docker Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-test-and-build, frontend-build]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config -q
